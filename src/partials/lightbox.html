  <!-- Lightbox -->
  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer" data-lightbox hidden>
    <div class="lightbox__stage" data-lightbox-stage>
      <img class="lightbox__img" alt="" data-lightbox-img>
      <p class="lightbox__missing" data-lightbox-missing hidden>ARTWORK UNAVAILABLE</p>
    </div>
    <div class="lightbox__bar">
      <p class="lightbox__count" data-lightbox-count></p>
      <p class="lightbox__caption" data-lightbox-caption></p>
      <div class="lightbox__controls">
        <button class="btn btn--quiet" type="button" data-lightbox-prev aria-label="Previous artwork">← PREV</button>
        <button class="btn btn--quiet" type="button" data-lightbox-next aria-label="Next artwork">NEXT →</button>
        <button class="btn btn--gilt" type="button" data-lightbox-close>CLOSE</button>
      </div>
    </div>
  </div>
